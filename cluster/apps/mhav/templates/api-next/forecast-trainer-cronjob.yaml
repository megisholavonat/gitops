# Retrains the delay forecast weekly and stores the model in mhav-next-pg; the
# api-next workers pick up the newest model within 10 minutes. The trainer image
# is the `trainer` stage of the API Dockerfile, pushed with the same tag.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mhav-api-next-forecast-trainer
spec:
  schedule: "15 4 * * 1"
  timeZone: Europe/Budapest
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: mhav-api-next-forecast-trainer
              image: ghcr.io/megisholavonat/mhav-api-trainer:{{ .Values.next.image.tag }}
              command: ["python", "-m", "api.forecast", "train", "--threads", "2"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: mhav-next-pg-app
                      key: uri
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
