# Postgres for api-next, separate from mhav-pg. The operator generates the
# `mhav-next-pg-app` secret (keys: username, password, host, uri, ...) and the
# `mhav-next-pg-rw` service; api-next reads DATABASE_URL from the `uri` key.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mhav-next-pg
  annotations:
    # Created before the migration job (wave -1) and the deployments (wave 0)
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: {{ .Values.next.postgres.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  bootstrap:
    initdb:
      database: mhav
      owner: mhav
  storage:
    size: {{ .Values.next.postgres.storage }}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
