# Runs `alembic upgrade head` with the api-next image before its deployments
# roll (Sync hook in wave -1, after mhav-next-pg in wave -2).
apiVersion: batch/v1
kind: Job
metadata:
  name: mhav-api-next-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/cloudnative-pg/postgresql:18
          command:
            - sh
            - -c
            - until pg_isready -h mhav-next-pg-rw -p 5432; do sleep 2; done
      containers:
        - name: migrate
          image: ghcr.io/megisholavonat/mhav-api:{{ .Values.next.image.tag }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mhav-next-pg-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
