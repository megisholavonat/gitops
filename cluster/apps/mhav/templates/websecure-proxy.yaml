apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    env:
      - name: PROXY_TRUSTED_IPS
        valueFrom:
          secretKeyRef:
            name: traefik-proxy-config
            key: trusted-ips

    additionalArguments:
      - "--entrypoints.websecureproxy.address=:8444"
      - "--entrypoints.websecureproxy.proxyProtocol.trustedIPs=$(PROXY_TRUSTED_IPS)"
      # Keep X-Forwarded-For from Cloudflare (append to it instead of
      # replacing it with the edge's address), so the web app's PostHog relay
      # forwards the visitor's IP. Cloudflare's ranges, from
      # https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
      # (retrieved 2026-10-28); update when Cloudflare changes them.
      - "--entrypoints.websecureproxy.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

    ports:
      websecureproxy:
        port: 8444
        expose:
          default: true
        exposedPort: 8444
        tls:
          enabled: true
