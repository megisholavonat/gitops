apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhav-dev-api-worker
spec:
  selector:
    matchLabels:
      app: mhav-dev-api-worker
  template:
    metadata:
      labels:
        app: mhav-dev-api-worker
    spec:
      containers:
        - name: mhav-dev-api-worker
          image: ghcr.io/megisholavonat/mhav-api:{{ .Values.image.tag }}
          command: ["taskiq"]
          args:
            [
              "worker",
              "api.core.taskiq_broker:broker",
              "--fs-discover",
              "--tasks-pattern",
              "api/tasks/**/*.py",
            ]
          env:
            - name: REDIS_HOST
              value: redis.redis
            - name: REDIS_KEY
              value: mhav-dev-api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-pg-app
                  key: uri
            # Dev keeps one month of raw delay history (prod: default 13)
            - name: HISTORY_RETENTION_MONTHS
              value: "1"
            - name: GRAPHQL_ENDPOINT
              value: "https://mavplusz.hu//otp2-backend/otp/routers/default/index/graphql"
            - name: SOCKS5_PROXY_ENABLE
              value: "true"
            - name: SOCKS5_PROXY_HOST
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-api-app-secret
                  key: SOCKS5_PROXY_HOST
            - name: SOCKS5_PROXY_PORT
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-api-app-secret
                  key: SOCKS5_PROXY_PORT
            - name: SOCKS5_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-api-app-secret
                  key: SOCKS5_PROXY_USERNAME
            - name: SOCKS5_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-api-app-secret
                  key: SOCKS5_PROXY_PASSWORD
            # iOS Live Activities through APNs; the key comes from the apns-secret
            # SealedSecret (see README), optional so pods start without it
            - name: APNS_BUNDLE_ID
              value: {{ .Values.apns.bundleId | quote }}
            - name: APNS_USE_SANDBOX
              value: {{ .Values.apns.useSandbox | quote }}
            - name: APNS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: apns-secret
                  key: APNS_KEY_ID
                  optional: true
            - name: APNS_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: apns-secret
                  key: APNS_TEAM_ID
                  optional: true
            - name: APNS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: apns-secret
                  key: APNS_PRIVATE_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
