apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhav-dev-api
spec:
  selector:
    matchLabels:
      app: mhav-dev-api
  template:
    metadata:
      labels:
        app: mhav-dev-api
    spec:
      containers:
        - name: mhav-dev-api
          image: ghcr.io/megisholavonat/mhav-api:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis.redis
            - name: REDIS_KEY
              value: mhav-dev-api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-pg-app
                  key: uri
            - name: POSTHOG_KEY
              value: phc_EcJKrQSOQnG0Donv3iO1XgWS7wPLEtKI5sy1Yl1OfoJ
            # Traefik connects from the k3s pod network (default cluster-cidr);
            # only it may set the client IP via CF-Connecting-IP
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16"
            - name: CLIENT_IP_HEADER
              value: CF-Connecting-IP
            - name: GRAPHQL_ENDPOINT
              value: "https://mavplusz.hu//otp2-backend/otp/routers/default/index/graphql"
            - name: SOCKS5_PROXY_ENABLE
              value: "true"
            - name: SOCKS5_PROXY_HOST
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-api-app-secret
                  key: SOCKS5_PROXY_HOST
            - name: SOCKS5_PROXY_PORT
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-api-app-secret
                  key: SOCKS5_PROXY_PORT
            - name: SOCKS5_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-api-app-secret
                  key: SOCKS5_PROXY_USERNAME
            - name: SOCKS5_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mhav-dev-api-app-secret
                  key: SOCKS5_PROXY_PASSWORD
            # iOS Live Activities through APNs; the key comes from the apns-secret
            # SealedSecret (see README), optional so pods start without it
            - name: APNS_BUNDLE_ID
              value: {{ .Values.apns.bundleId | quote }}
            - name: APNS_USE_SANDBOX
              value: {{ .Values.apns.useSandbox | quote }}
            - name: APNS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: apns-secret
                  key: APNS_KEY_ID
                  optional: true
            - name: APNS_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: apns-secret
                  key: APNS_TEAM_ID
                  optional: true
            - name: APNS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: apns-secret
                  key: APNS_PRIVATE_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
